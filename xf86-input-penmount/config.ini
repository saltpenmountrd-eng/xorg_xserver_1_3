# PenMount Xorg 驱动安装配置 / PenMount Xorg driver setup configuration
#
# 此文件为可选配置。在执行 penmount-setup.sh install 时：
# 1. 脚本会自动枚举扫描系统中的输入设备，找到第一个 VID=14e1 的 PenMount 触摸屏并自动将其 PID (如 0x6000 或 0x6005) 填入 xorg.conf。
# 2. 如果在此文件中取消注释并设置了对应参数，则以此文件中的预设值为准。

[penmount]
# 是否开启详细调试日志 (0 = off, 1 = on)
# 开启后会在 /var/log/Xorg.0.log 中输出带有 [calib-debug] 和 [hotplug-debug] 的详细日志
# debug = 0

# 延迟关闭文件描述符的毫秒数 (0 = 立即关闭, >0 = 延迟毫秒数, -1 = 保持打开)
# 用于排查与规避特定旧内核 USB 断线时的竞争卡死问题
# closedelay = 0

# 触摸屏 Product ID (如 0x6000 或 0x6005)
# 默认留空即可，安装脚本会自动扫描连接的 PenMount 设备 PID；如需手动指定可取消注释
# product = 0x6000
